<section class="services">
  <div class="container-services">
    <header class="services-header">
      <h2 class="text-services">
        <span class="highlight-primary">Catálogo de servicios,</span><br>
        <span class="highlight-secondary">¡tu solución perfecta!</span>
      </h2>
      <hr class="divider-services">
    </header>
  </div>

  <div class="button-container">
    <!-- First Row -->
    <article class="service-item">
      <button class="button-item" [routerLink]="['/cartera']" data-value="Portfolio" aria-label="Portfolio">
        <h3 class="service-title">Cartera</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de cartera" loading="lazy">
      </button>
      <div class="icon-container">
        <img class="icon" width="34" height="28" src="/assets/icons/cartera.webp" alt="cartera">
      </div>
    </article>

    <article class="service-item">
      <button class="button-item" [routerLink]="['/responsabilidad']" data-value="Liability" aria-label="Civil Liability">
        <h3 class="service-title">Responsabilidad Civil</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de responsabilidad civil" loading="lazy">
      </button>
      <div class="icon-container">
        <img class="icon" width="34" height="28" src="assets/icons/igroup.webp" alt="Responsabilidad Civil">
      </div>
    </article>

    <article class="service-item">
      <button class="button-item" [routerLink]="['/inmobiliaria']" data-value="RealEstate" aria-label="Real Estate">
        <h3 class="service-title">Inmobiliario</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de inmobiliario" loading="lazy">
      </button>
      <div class="icon-container">
        <img class="icon" width="34" height="28" src="/assets/icons/home.webp" alt="inmobiliario">
      </div>
    </article>

    <!-- Second Row -->
    <article class="service-item">
      <button class="button-item" [routerLink]="['/laboral']" data-value="SmallBusiness" aria-label="Labor and Commercial">
        <h3 class="service-title">Laboral</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de laboral" loading="lazy">
      </button>
      <div class="icon-container">
        <img class="icon" width="34" height="28" src="/assets/icons/bolso.webp" alt="laboral">
      </div>
    </article>

    <article class="service-item">
      <button class="button-item" [routerLink]="['/propiedad-horizontal']" data-value="PropertyManagement" aria-label="Property Management">
        <h3 class="service-title">Propiedad Horizontal</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de propiedad horizontal" loading="lazy">
      </button>
      <div class="icon-container">
        <svg class="icon" width="34" height="28" viewBox="0 0 34 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 26H32M6 26V8L17 2L28 8V26" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 12H22M12 17H22M12 22H22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </article>

    <article class="service-item">
      <button class="button-item" [routerLink]="['/derecho-comercial']" data-value="Commercial" aria-label="Commercial Law">
        <h3 class="service-title">Derecho Comercial</h3>
        <img class="service-image" src="assets/icons/Mayor.svg" alt="Icono de derecho comercial" loading="lazy">
      </button>
      <div class="icon-container">
        <svg class="icon" width="34" height="28" viewBox="0 0 34 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 14H30M4 7H30M4 21H30" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <path d="M10 3V25M24 3V25" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </article>
  </div>
</section>
