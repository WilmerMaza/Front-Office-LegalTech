<Section class="signature">
  <section class="header-title">
    <h2 id="signature-title" class="signature-section-title">
      {{ "FIRMA.TITLE_PART_ONE" | translate }}
    </h2>
  </section>
  <section class="content-text">
    <p class="signature-section-text">{{ "FIRMA.TEXT_ONE" | translate }}</p>
    <a
      class="signature-section-button"
      [routerLink]="'/about'"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      role="button"
      aria-label="Leer más sobre nuestra firma legal"
    >
    {{ "FIRMA.TITLE_PART_TWO" | translate }}
    </a>
  </section>
</Section>
